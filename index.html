<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>KUCHA QUANT · 量化控制台</title>

<!-- Tabler 1.5.0（MIT）—— 开源仪表盘 UI 套件，自带深色主题 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.5.0/dist/css/tabler.min.css">
<!-- TradingView Lightweight Charts 5.2.1（Apache-2.0）—— 专业金融图表 -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>

<style>
:root{
  --kq-s1:#3987e5;        /* 策略序列 */
  --kq-s2:#d95926;        /* 基准序列 */
  --kq-grid:#1c2733;
  --kq-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
body{background:#0b0f14}
.page-wrapper,.navbar{background:#0b0f14}
.card{background:#10161d;border-color:#1c2733}
.card-header{border-bottom-color:#1a2430}
.table{--tblr-table-border-color:#1a2430}
.navbar{border-bottom:1px solid #1c2733}

/* 所有数字用等宽，列才对得齐 */
.num,.table td,.table th,.datagrid-content{font-family:var(--kq-mono);font-variant-numeric:tabular-nums}
.brand-mark{font-family:var(--kq-mono);letter-spacing:.18em;font-size:.95rem;font-weight:600}
.brand-mark .dot{color:var(--kq-s1)}
.subheader{font-family:var(--kq-mono);letter-spacing:.1em}

#chart{height:340px;width:100%}
.chart-legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-family:var(--kq-mono);font-size:.75rem}
.chart-legend i{width:14px;height:2px;border-radius:1px;display:inline-block}
.chart-note{font-family:var(--kq-mono);font-size:.75rem}

.order{border-left:3px solid var(--tblr-border-color);padding:.75rem .9rem;border-radius:0 4px 4px 0;
       background:#0d131a;margin-bottom:.6rem}
.order:last-child{margin-bottom:0}
.order.buy{border-left-color:var(--tblr-green)}
.order.sell{border-left-color:var(--tblr-red)}
.order .sym{font-family:var(--kq-mono);font-weight:700;font-size:1.02rem}
.order .meta{font-family:var(--kq-mono);font-size:.76rem;line-height:1.75}

.empty-sm{padding:1.6rem .75rem;text-align:center;font-family:var(--kq-mono);font-size:.8rem;
          color:var(--tblr-secondary);line-height:1.9}
.stop-price{color:var(--tblr-orange)}
.gate-mark{font-family:var(--kq-mono);letter-spacing:.22em;font-size:1.25rem}
</style>
</head>
<body class="antialiased">

<!-- ══════════ 登录 ══════════ -->
<div class="page page-center" id="gate">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <div class="gate-mark">KUCHA<span style="color:var(--kq-s1)">·</span>QUANT</div>
      <div class="text-secondary mt-2" style="font-size:.82rem">量化控制台 · 需管理员权限</div>
    </div>
    <form class="card card-md" id="login-form" autocomplete="on">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label subheader" for="u">账号</label>
          <input id="u" name="username" type="email" class="form-control" autocomplete="username"
                 placeholder="haiyangkwong@gmail.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label subheader" for="p">密码</label>
          <input id="p" name="password" type="password" class="form-control"
                 autocomplete="current-password" required>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100" id="login-btn">进入</button>
        </div>
        <div class="text-danger mt-3 text-center" id="login-err" role="alert"
             style="min-height:1.2rem;font-size:.82rem"></div>
      </div>
    </form>
  </div>
</div>

<!-- ══════════ 控制台 ══════════ -->
<div class="page" id="console" hidden>
  <header class="navbar navbar-expand-md sticky-top">
    <div class="container-xl">
      <span class="navbar-brand brand-mark mb-0">KUCHA<span class="dot">·</span>QUANT</span>
      <span class="badge bg-secondary-lt ms-2" id="status-badge">载入中</span>
      <div class="ms-auto d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" id="refresh">刷新</button>
        <button class="btn btn-sm btn-outline-secondary" id="logout">登出</button>
      </div>
    </div>
  </header>

  <div class="page-body">
    <div class="container-xl">

      <div class="row row-cards mb-3" id="tiles"></div>

      <div class="card mb-3">
        <div class="card-header d-flex align-items-center flex-wrap gap-2">
          <h3 class="card-title mb-0">权益曲线</h3>
          <div class="chart-legend ms-3" id="legend"></div>
          <div class="ms-auto btn-group btn-group-sm" role="group">
            <button class="btn btn-outline-secondary active" id="btn-live">实盘</button>
            <button class="btn btn-outline-secondary" id="btn-bt">回测</button>
          </div>
        </div>
        <div class="card-body">
          <div id="chart"></div>
          <div id="chart-empty" class="empty-sm" hidden></div>
        </div>
      </div>

      <div class="row row-cards mb-3">
        <div class="col-lg-6">
          <div class="card h-100">
            <div class="card-header">
              <h3 class="card-title mb-0">明日开盘指令</h3>
              <span class="card-subtitle ms-auto num" id="ord-date"></span>
            </div>
            <div class="card-body" id="orders"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card h-100">
            <div class="card-header">
              <h3 class="card-title mb-0">当前持仓</h3>
              <span class="card-subtitle ms-auto num" id="pos-count"></span>
            </div>
            <div id="positions"></div>
          </div>
        </div>
      </div>

      <div class="row row-cards mb-3">
        <div class="col-lg-6">
          <div class="card h-100">
            <div class="card-header"><h3 class="card-title mb-0">汇丰 Trade25 月度额度</h3></div>
            <div class="card-body" id="budget"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card h-100">
            <div class="card-header"><h3 class="card-title mb-0">止损调整</h3></div>
            <div id="stops"></div>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">策略参数</h3></div>
        <div class="card-body">
          <div class="datagrid" id="params"></div>
        </div>
      </div>

      <div class="text-secondary" style="font-size:.75rem;line-height:1.9">
        信号由 kucha-quant 按既定规则生成，不构成投资建议。回测收益不代表未来收益。<br>
        数据经 api.kucha.org 读取，仅管理员可见。
      </div>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://api.kucha.org';
const TK = 'kq_token';
const $ = s => document.querySelector(s);

const money = (n, d = 2) => (n == null || isNaN(n)) ? '—'
  : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = n => (n == null || isNaN(n)) ? '—' : (n >= 0 ? '+' : '') + (n * 100).toFixed(1) + '%';
const tone = n => n == null || isNaN(n) ? 'text-secondary' : n > 0 ? 'text-green' : n < 0 ? 'text-red' : 'text-secondary';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ───── 登录 ───── */
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#login-btn'), err = $('#login-err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch(WORKER + '/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('#u').value.trim(), password: $('#p').value }),
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || '登录失败');
    localStorage.setItem(TK, d.token);
    boot();
  } catch (ex) { err.textContent = ex.message; }
  finally { btn.disabled = false; }
});
$('#logout').onclick = () => { localStorage.removeItem(TK); location.reload(); };
$('#refresh').onclick = () => boot();

/* ───── 取数 ───── */
let DATA = null, MODE = 'live', chart = null, series = [];

async function boot() {
  const token = localStorage.getItem(TK);
  if (!token) { $('#gate').hidden = false; $('#console').hidden = true; return; }
  $('#gate').hidden = true; $('#console').hidden = false;
  setStatus('secondary', '载入中');
  try {
    const r = await fetch(WORKER + '/quant/dashboard', { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { localStorage.removeItem(TK); location.reload(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    render();
  } catch (ex) { setStatus('orange', '读取失败 · ' + ex.message); }
}
function setStatus(color, txt) {
  $('#status-badge').className = 'badge bg-' + color + '-lt ms-2';
  $('#status-badge').textContent = txt;
}

/* ───── 渲染 ───── */
function render() {
  const L = DATA.latest, EQ = DATA.equity || [], BT = DATA.backtest;
  if (L) {
    const age = (Date.now() - (L.sent_at || 0)) / 86400000;
    setStatus(age < 4 ? 'green' : 'orange',
      `${L.date} · ${age < 1 ? '今日已更新' : Math.floor(age) + ' 天前'}`);
  } else setStatus('orange', '尚未收到信号');

  renderTiles(L, EQ);
  renderChart(EQ, BT);
  renderOrders(L);
  renderPositions(L);
  renderBudget(L);
  renderStops(L);
  renderParams(BT);
}

function tile(label, value, sub, cls) {
  return `<div class="col-sm-6 col-lg-3"><div class="card"><div class="card-body">
    <div class="subheader mb-2">${label}</div>
    <div class="h1 mb-1 num ${cls || ''}">${value}</div>
    <div class="text-secondary num" style="font-size:.74rem">${esc(sub)}</div>
  </div></div></div>`;
}

function renderTiles(L, EQ) {
  const eq = L && L.equity;
  let chg = null;
  if (EQ.length >= 2) chg = EQ[EQ.length - 1].v / EQ[EQ.length - 2].v - 1;
  const holds = L && L.holdings ? L.holdings.length : 0;
  const maxPos = (DATA.backtest && DATA.backtest.params && DATA.backtest.params.max_positions) || 5;
  const b = L && L.budget;
  const bp = b ? Math.round((b.used_pct || 0) * 100) : null;
  $('#tiles').innerHTML =
    tile('账户权益', eq ? money(eq.total) : '—',
         eq ? `现金 ${money(eq.cash, 0)} · 持仓 ${money(eq.market_value, 0)}` : '等待首次信号') +
    tile('较上次', chg == null ? '—' : pct(chg),
         EQ.length ? `已记录 ${EQ.length} 个交易日` : '暂无历史', tone(chg)) +
    tile('持仓', holds + ' / ' + maxPos,
         L ? (L.regime_on ? '大盘上升趋势 · 可开新仓' : '大盘弱势 · 只减不增') : '—') +
    tile('汇丰额度', bp == null ? '—' : bp + '%',
         b ? `${money(b.used_usd, 0)} / ${money(b.cap_usd, 0)}` : '暂无',
         bp == null ? '' : bp >= 85 ? 'text-red' : bp >= 60 ? 'text-orange' : '');
}

/* ───── 权益曲线（TradingView Lightweight Charts）───── */
function renderChart(EQ, BT) {
  const box = $('#chart'), empty = $('#chart-empty'), legend = $('#legend');
  const live = (EQ || []).map(p => ({ time: p.d, value: p.v }));
  const btc = (BT && BT.curve) || [];

  let defs, note = '';
  const wantBt = MODE === 'bt' && btc.length >= 2;
  if (!wantBt && live.length >= 2) {
    defs = [{ name: '实盘权益', color: 'var(--kq-s1)', hex: '#3987e5', data: live }];
  } else if (btc.length >= 2) {
    defs = [
      { name: '策略（回测）', hex: '#3987e5', data: btc.map(p => ({ time: p.d, value: p.v })) },
      { name: 'QQQ 买入持有', hex: '#d95926',
        data: btc.filter(p => p.b != null).map(p => ({ time: p.d, value: p.b })) },
    ].filter(d => d.data.length >= 2);
    if (live.length < 2) note = '实盘数据不足，先显示回测曲线';
  } else {
    box.hidden = true; empty.hidden = false; legend.innerHTML = '';
    empty.innerHTML = '还没有权益数据。<br>系统每天美股收盘后运行一次，跑完第一次就会出现在这里。';
    syncButtons(live.length, btc.length);
    return;
  }
  box.hidden = false; empty.hidden = true;

  legend.innerHTML = defs.map(d =>
    `<span><i style="background:${d.hex}"></i> <span class="text-secondary">${esc(d.name)}</span>
     <b class="ms-1" id="lg-${d.hex.slice(1)}"></b></span>`).join('')
    + (note ? `<span class="text-secondary chart-note">${esc(note)}</span>` : '');

  if (chart) { chart.remove(); chart = null; series = []; }
  chart = LightweightCharts.createChart(box, {
    layout: { background: { color: 'transparent' }, textColor: '#7d8b99',
              fontFamily: 'ui-monospace,SFMono-Regular,Menlo,monospace', fontSize: 11 },
    grid: { vertLines: { color: '#161f28' }, horzLines: { color: '#161f28' } },
    rightPriceScale: { borderColor: '#1c2733', scaleMargins: { top: 0.12, bottom: 0.08 } },
    timeScale: { borderColor: '#1c2733', fixLeftEdge: true, fixRightEdge: true },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Magnet,
      vertLine: { color: '#3d4d5c', width: 1, style: 2, labelBackgroundColor: '#1c2733' },
      horzLine: { color: '#3d4d5c', width: 1, style: 2, labelBackgroundColor: '#1c2733' },
    },
    localization: { priceFormatter: v => '$' + Math.round(v).toLocaleString('en-US') },
    autoSize: true,
  });

  series = defs.map(d => {
    const s = chart.addSeries(LightweightCharts.LineSeries, {
      color: d.hex, lineWidth: 2, priceLineVisible: false, lastValueVisible: true,
    });
    s.setData(d.data);
    return { def: d, api: s };
  });
  chart.timeScale().fitContent();

  chart.subscribeCrosshairMove(param => {
    series.forEach(({ def, api }) => {
      const el = document.getElementById('lg-' + def.hex.slice(1));
      if (!el) return;
      const pt = param.seriesData && param.seriesData.get(api);
      const last = def.data[def.data.length - 1];
      el.textContent = money(pt ? pt.value : last.value, 0);
    });
  });
  series.forEach(({ def }) => {
    const el = document.getElementById('lg-' + def.hex.slice(1));
    if (el) el.textContent = money(def.data[def.data.length - 1].value, 0);
  });

  syncButtons(live.length, btc.length, defs.length > 1 || wantBt);
}

function syncButtons(nLive, nBt, showingBt) {
  $('#btn-live').disabled = nLive < 2;
  $('#btn-bt').disabled = nBt < 2;
  $('#btn-live').classList.toggle('active', !showingBt);
  $('#btn-bt').classList.toggle('active', !!showingBt);
}
$('#btn-live').onclick = () => { MODE = 'live'; if (DATA) renderChart(DATA.equity || [], DATA.backtest); };
$('#btn-bt').onclick = () => { MODE = 'bt'; if (DATA) renderChart(DATA.equity || [], DATA.backtest); };

function renderOrders(L) {
  const box = $('#orders');
  $('#ord-date').textContent = L ? L.date : '';
  const acts = (L && L.actions) || [];
  if (!acts.length) {
    box.innerHTML = `<div class="empty-sm">${L ? '无买卖指令，持仓照旧。' : '尚未收到信号。'}</div>`;
    return;
  }
  box.innerHTML = acts.map(a => `
    <div class="order ${a.side === 'buy' ? 'buy' : 'sell'}">
      <div class="d-flex align-items-baseline gap-2">
        <span class="badge ${a.side === 'buy' ? 'bg-green-lt' : 'bg-red-lt'}">${a.side === 'buy' ? '买入' : '卖出'}</span>
        <span class="sym">${esc(a.symbol)}</span>
        <span class="text-secondary num">${a.shares} 股 @ ${money(a.ref_price)}</span>
      </div>
      <div class="meta text-secondary">
        ${a.notional ? '约 ' + money(a.notional, 0) : ''}${a.stop ? ' · 挂止损 <b class="stop-price">' + money(a.stop) + '</b>（GTC）' : ''}
        ${a.reason ? '<br>' + esc(a.reason) : ''}</div>
    </div>`).join('');
}

function renderPositions(L) {
  const hs = (L && L.holdings) || [];
  $('#pos-count').textContent = hs.length ? hs.length + ' 只' : '';
  if (!hs.length) { $('#positions').innerHTML = `<div class="empty-sm">当前空仓。</div>`; return; }
  $('#positions').innerHTML = `<div class="table-responsive"><table class="table table-vcenter card-table">
    <thead><tr><th>标的</th><th class="text-end">股数</th><th class="text-end">成本</th>
    <th class="text-end">现价</th><th class="text-end">盈亏</th><th class="text-end">止损</th>
    <th class="text-end">持有</th></tr></thead><tbody>` +
    hs.map(h => `<tr>
      <td><strong>${esc(h.symbol)}</strong></td>
      <td class="text-end">${h.shares}</td>
      <td class="text-end">${money(h.entry_price)}</td>
      <td class="text-end">${money(h.last_price)}</td>
      <td class="text-end ${tone(h.pnl_pct)}"><strong>${pct(h.pnl_pct)}</strong></td>
      <td class="text-end stop-price">${money(h.stop)}</td>
      <td class="text-end text-secondary">${h.days}d</td>
    </tr>`).join('') + '</tbody></table></div>';
}

function renderBudget(L) {
  const b = L && L.budget;
  if (!b) { $('#budget').innerHTML = `<div class="empty-sm">暂无额度数据。</div>`; return; }
  const p = Math.min(100, Math.round((b.used_pct || 0) * 100));
  const color = p >= 85 ? 'bg-red' : p >= 60 ? 'bg-orange' : 'bg-green';
  $('#budget').innerHTML = `
    <div class="d-flex justify-content-between mb-2">
      <span class="text-secondary" style="font-size:.82rem">本月已成交</span>
      <span class="num">${money(b.used_usd, 0)} / ${money(b.cap_usd, 0)}</span></div>
    <div class="progress progress-sm"><div class="progress-bar ${color}" style="width:${p}%"
      role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"></div></div>
    <div class="text-secondary mt-3" style="font-size:.76rem;line-height:1.8">
      上限 HK$250,000（约 $32,051）。超出后美股按首 1000 股 $18 + 每股 $0.015 收佣。
      ${p >= 85 ? '<div class="text-red mt-1">额度将尽，本月请克制交易。</div>' : ''}
    </div>`;
}

function renderStops(L) {
  const su = (L && L.stop_updates) || [];
  if (!su.length) { $('#stops').innerHTML = `<div class="empty-sm">无需调整止损。</div>`; return; }
  $('#stops').innerHTML = `<div class="table-responsive"><table class="table table-vcenter card-table">
    <thead><tr><th>标的</th><th class="text-end">原止损</th><th class="text-end">新止损</th>
    <th class="text-end">上移</th></tr></thead><tbody>` +
    su.map(s => `<tr><td><strong>${esc(s.symbol)}</strong></td>
      <td class="text-end text-secondary">${money(s.from)}</td>
      <td class="text-end stop-price"><strong>${money(s.to)}</strong></td>
      <td class="text-end text-green">${pct(s.to / s.from - 1)}</td></tr>`).join('') +
    '</tbody></table></div>';
}

function renderParams(BT) {
  const p = (BT && BT.params) || {}, st = (BT && BT.stats) || {};
  const rows = [
    ['策略', p.name || '科技股日线波段'],
    ['标的池', (p.universe_size || '—') + ' 只科技股'],
    ['最大持仓', (p.max_positions ?? '—') + ' 只'],
    ['每笔风险', p.risk_per_trade_pct != null ? (p.risk_per_trade_pct * 100).toFixed(1) + '%' : '—'],
    ['入场', p.breakout_lookback ? `突破 ${p.breakout_lookback} 日新高` : '—'],
    ['止损', p.atr_stop_mult ? `${p.atr_stop_mult} × ATR${p.atr_period || ''}` : '—'],
    ['移动止损', p.trail_mult ? `${p.trail_mult} × ATR` : '—'],
    ['大盘择时', p.regime_ma ? `SPY ${p.regime_ma} 日均线` : '—'],
    ['回测年化', st['年化收益'] != null ? pct(st['年化收益']) : '—'],
    ['回测夏普', st['夏普'] != null ? st['夏普'].toFixed(2) : '—'],
    ['回测最大回撤', st['最大回撤'] != null ? pct(st['最大回撤']) : '—'],
    ['回测区间', st['起止'] || '—'],
  ];
  $('#params').innerHTML = rows.map(([k, v]) =>
    `<div class="datagrid-item"><div class="datagrid-title">${k}</div>
     <div class="datagrid-content">${esc(v)}</div></div>`).join('');
}

boot();
</script>
</body>
</html>
