<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>KUCHA</title>

<!-- 单词本的样式直接来自 Word Scanner 插件，所以网页上的词表和插件里逐像素一致 -->
<link rel="stylesheet" href="wordbook.css">
<!-- 量化模块的组件，配色变量沿用上面那一套 -->
<link rel="stylesheet" href="app.css">

<!-- TradingView Lightweight Charts 5.2.1（Apache-2.0）—— 金融图表 -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<!-- Fuse.js 7.1.0（Apache-2.0）—— 模糊搜索，拼错也能命中 -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"></script>
</head>
<body>

<!-- ══════════ 登录 ══════════ -->
<div class="login-wrap" id="gate">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-mark">KUCHA</div>
    <div class="login-sub">单词本 · 量化</div>
    <div class="field">
      <label for="u">账号</label>
      <input id="u" name="username" type="email" class="inp" autocomplete="username"
             placeholder="haiyangkwong@gmail.com" required>
    </div>
    <div class="field">
      <label for="p">密码</label>
      <input id="p" name="password" type="password" class="inp"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="login-btn"
            style="width:100%;padding:10px">登录</button>
    <div class="login-err" id="login-err" role="alert"></div>
  </form>
</div>

<!-- ══════════ 主体 ══════════ -->
<div id="app" hidden>
  <nav class="topnav">
    <div class="topnav-inner">
      <span class="wordmark">KUCHA</span>
      <div class="tabs" role="tablist">
        <button class="tab active" data-mod="words">单词本</button>
        <button class="tab" data-mod="quant">量化</button>
      </div>
      <div class="topnav-right">
        <span class="badge" id="status-badge">载入中</span>
        <button class="btn btn-sm" id="refresh">刷新</button>
        <button class="btn btn-sm" id="logout">登出</button>
      </div>
    </div>
  </nav>

  <!-- ─────────── 模块一：单词本 ─────────── -->
  <div id="mod-words">
    <div class="page">
      <header class="hero">
        <h1>我的词库</h1>
        <p class="hero-sub" id="w-sub">载入中…</p>
      </header>

      <div class="stats-section" id="w-stats"></div>

      <div class="card" style="margin-top:22px">
        <div class="card-head">
          <h2>每日新增</h2>
          <span class="sub" id="w-chart-sub"></span>
        </div>
        <div class="card-body">
          <div id="w-chart" style="height:170px"></div>
        </div>
      </div>

      <div class="list-toolbar" style="margin-top:22px">
        <input type="search" class="inp" id="w-search" placeholder="搜单词或释义"
               style="max-width:210px">
        <div class="seg" id="w-filter-seg" role="group">
          <button class="seg-btn active" data-f="">全部</button>
          <button class="seg-btn" data-f="new">未掌握</button>
          <button class="seg-btn" data-f="mastered">已掌握</button>
          <button class="seg-btn" data-f="recent">近 7 天</button>
        </div>
        <select class="inp" id="w-sort" style="max-width:130px">
          <option value="new">最新收录</option>
          <option value="old">最早收录</option>
          <option value="az">字母顺序</option>
          <option value="review">复习次数</option>
        </select>
      </div>

      <div class="result-meta" id="w-meta"></div>
      <div class="entry-list" id="w-list"></div>
    </div>
  </div>

  <!-- ─────────── 模块二：量化 ─────────── -->
  <div id="mod-quant" hidden>
    <div class="page-wide">
      <div class="tabs" style="margin:18px 0 22px" role="tablist">
        <button class="tab active" data-tab="overview">总览</button>
        <button class="tab" data-tab="pool">标的池 <span class="badge" id="tab-pool-count">—</span></button>
        <button class="tab" data-tab="strategy">策略 <span class="badge" id="tab-stg-name">—</span></button>
        <button class="tab" data-tab="records">记录</button>
      </div>

      <!-- 总览 -->
      <section id="tab-overview">
        <div class="grid grid-4" id="tiles"></div>

        <div class="card">
          <div class="card-head">
            <h2>权益曲线</h2>
            <div class="legend" id="legend" style="margin-left:14px"></div>
            <div class="seg" style="margin-left:auto">
              <button class="seg-btn active" id="btn-live">实盘</button>
              <button class="seg-btn" id="btn-bt">回测</button>
            </div>
          </div>
          <div class="card-body">
            <div id="chart" class="chart-box" style="height:320px"></div>
            <div id="chart-empty" class="empty-state" hidden></div>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card" style="margin:0">
            <div class="card-head"><h2>明日开盘指令</h2><span class="sub" id="ord-date"></span></div>
            <div class="card-body" id="orders"></div>
          </div>
          <div class="card" style="margin:0">
            <div class="card-head"><h2>当前持仓</h2><span class="sub" id="pos-count"></span></div>
            <div class="card-body tight scroll-x" id="positions"></div>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card" style="margin:0">
            <div class="card-head"><h2>汇丰 Trade25 月度额度</h2></div>
            <div class="card-body" id="budget"></div>
          </div>
          <div class="card" style="margin:0">
            <div class="card-head"><h2>止损调整</h2></div>
            <div class="card-body tight scroll-x" id="stops"></div>
          </div>
        </div>
      </section>

      <!-- 标的池 -->
      <section id="tab-pool" hidden>
        <div class="card">
          <div class="card-body">
            <div class="field" style="margin:0">
              <label>添加标的</label>
              <div style="position:relative">
                <input type="search" class="inp" id="pool-search" autocomplete="off"
                       placeholder="代码或英文公司名，如 SPCX / Space Exploration / nvdia（拼错也能搜到）">
                <div id="pool-results" class="search-pop" hidden></div>
              </div>
              <div class="hint" id="pool-msg">
                标普 500 的 503 只加上全市场搜索。数据源只索引英文名，中文搜不到。
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h2>当前标的池</h2><span class="sub" id="pool-count">—</span></div>
          <div class="card-body" id="pool-chips"><div class="empty-state">载入中…</div></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>浏览标普 500</h2>
            <select class="inp" id="uni-sector" style="max-width:150px;margin-left:auto">
              <option value="">全部行业</option>
            </select>
            <input type="search" class="inp" id="uni-filter" placeholder="在名单内筛选"
                   style="max-width:160px">
            <button class="btn btn-sm" id="uni-all">全选筛选结果</button>
            <button class="btn btn-sm" id="uni-none">清空筛选结果</button>
          </div>
          <div class="card-body tight" id="uni-list" style="max-height:52vh;overflow:auto"></div>
        </div>

        <div class="savebar">
          <span class="mono" id="pool-state">—</span>
          <span class="sec" style="font-size:12px">改动要点保存才会在下次运行生效</span>
          <button class="btn btn-primary btn-sm" id="pool-save" style="margin-left:auto" disabled>
            保存标的池</button>
        </div>
      </section>

      <!-- 策略 -->
      <section id="tab-strategy" hidden>
        <div style="display:grid;grid-template-columns:250px 1fr;gap:16px" id="stg-layout">
          <div class="card" style="margin:0">
            <div class="card-head">
              <h2>方案</h2>
              <button class="btn btn-sm" id="stg-new" style="margin-left:auto">新建</button>
            </div>
            <div class="card-body" id="stg-list"></div>
          </div>
          <div>
            <div class="card">
              <div class="card-body">
                <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:14px;margin-bottom:16px">
                  <div class="field" style="margin:0">
                    <label>方案名</label>
                    <input class="inp" id="stg-name" maxlength="24">
                  </div>
                  <div class="field" style="margin:0">
                    <label>备注</label>
                    <input class="inp" id="stg-note" maxlength="80" placeholder="这套想验证什么">
                  </div>
                </div>
                <div id="stg-form"></div>
              </div>
              <div class="card-head" style="border-bottom:0;border-top:1px solid var(--hairline)">
                <span id="stg-msg" style="font-size:12.5px"></span>
                <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
                  <button class="btn btn-sm btn-danger" id="stg-del">删除</button>
                  <button class="btn btn-sm" id="stg-bt">回测这套</button>
                  <button class="btn btn-sm" id="stg-activate">设为生效</button>
                  <button class="btn btn-sm btn-primary" id="stg-save">保存</button>
                </div>
              </div>
            </div>
            <div id="stg-result"></div>
          </div>
        </div>
      </section>

      <!-- 记录 -->
      <section id="tab-records" hidden>
        <div class="card">
          <div class="card-head"><h2>成交记录</h2><span class="sub" id="trade-summary"></span></div>
          <div class="card-body tight scroll-x" id="trades"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>生效策略参数</h2></div>
          <div class="card-body" id="params"></div>
        </div>
      </section>

      <div class="panel-note" style="margin:26px 0 0;font-size:12px;line-height:1.9">
        信号按既定规则自动生成，不构成投资建议。回测收益不代表未来收益。
      </div>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://api.kucha.org';
const TK = 'kq_token';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const money = (n, d = 2) => (n == null || isNaN(n)) ? '—'
  : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = n => (n == null || isNaN(n)) ? '—' : (n >= 0 ? '+' : '') + (n * 100).toFixed(1) + '%';
const tone = n => n == null || isNaN(n) ? 'sec' : n > 0 ? 'up' : n < 0 ? 'down' : 'sec';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const auth = () => ({ Authorization: 'Bearer ' + localStorage.getItem(TK) });
const ymd = t => new Date(t).toISOString().slice(0, 10);

/* ───── 模块切换 ───── */
function showMod(name) {
  const m = name === 'quant' ? 'quant' : 'words';
  $('#mod-words').hidden = m !== 'words';
  $('#mod-quant').hidden = m !== 'quant';
  $$('.topnav .tab').forEach(b => b.classList.toggle('active', b.dataset.mod === m));
  location.hash = m === 'quant' ? (qTab === 'overview' ? 'quant' : 'quant/' + qTab) : 'words';
  if (m === 'words') { if (!WORDS) wordsLoad(); else wordsChart(); }
  else { if (!DATA) boot(); else if (qTab === 'overview') renderChart(DATA.equity || [], DATA.backtest); }
}
$$('.topnav .tab').forEach(b => { b.onclick = () => showMod(b.dataset.mod); });

/* ───── 量化子标签 ───── */
const QTABS = ['overview', 'pool', 'strategy', 'records'];
let qTab = 'overview';
function showQTab(name) {
  qTab = QTABS.includes(name) ? name : 'overview';
  QTABS.forEach(t => { $('#tab-' + t).hidden = t !== qTab; });
  $$('#mod-quant .tabs .tab').forEach(a => a.classList.toggle('active', a.dataset.tab === qTab));
  location.hash = qTab === 'overview' ? 'quant' : 'quant/' + qTab;
  if (qTab === 'overview' && DATA) renderChart(DATA.equity || [], DATA.backtest);
  if (qTab === 'pool' && !SP500.length) poolLoad();
  if (qTab === 'strategy' && !Object.keys(STG.presets || {}).length) stgReload();
}
$$('#mod-quant .tabs .tab').forEach(a => { a.onclick = () => showQTab(a.dataset.tab); });

function applyHash() {
  const h = (location.hash || '#words').slice(1);
  if (h.startsWith('quant')) {
    const sub = h.split('/')[1];
    if (sub) qTab = QTABS.includes(sub) ? sub : 'overview';
    showMod('quant'); showQTab(qTab);
  } else showMod('words');
}
window.addEventListener('hashchange', applyHash);

/* ───── 登录 ───── */
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#login-btn'), err = $('#login-err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch(WORKER + '/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('#u').value.trim(), password: $('#p').value }),
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || '登录失败');
    localStorage.setItem(TK, d.token);
    start();
  } catch (ex) { err.textContent = ex.message; }
  finally { btn.disabled = false; }
});
$('#logout').onclick = () => { localStorage.removeItem(TK); location.reload(); };
$('#refresh').onclick = () => { WORDS = null; DATA = null; SP500 = []; boot(); wordsLoad(); };

function start() {
  if (!localStorage.getItem(TK)) { $('#gate').hidden = false; $('#app').hidden = true; return; }
  $('#gate').hidden = true; $('#app').hidden = false;
  applyHash();
  boot();
}
function setStatus(kind, txt) {
  $('#status-badge').className = 'badge' + (kind ? ' ' + kind : '');
  $('#status-badge').textContent = txt;
}

/* ══════════ 单词本 ══════════
   字段被插件压缩过：w 单词 / p 音标 / d 英释 / t 中释 / s 例句 / src 出处
   / a 收录时间 / b Leitner 盒号 / r 复习次数 / m 已掌握 / tag 考试标签 */
let WORDS = null, WMETA = null, wChart = null, wFilter = '';

async function wordsLoad() {
  if (!localStorage.getItem(TK)) return;
  $('#w-list').innerHTML = '<div class="loading-state">载入中…</div>';
  try {
    const d = await (await fetch(WORKER + '/words', { headers: auth() })).json();
    if (!d.success) throw new Error(d.error || '读取失败');
    WORDS = d.words || []; WMETA = d.meta || null;
    wordsStats(); wordsChart(); wordsList();
  } catch (ex) {
    $('#w-list').innerHTML = `<div class="empty-state">读取失败：${esc(ex.message)}</div>`;
    $('#w-sub').textContent = '';
  }
}

function wordsStats() {
  const now = Date.now(), DAY = 86400000;
  const total = WORDS.length;
  const mastered = WORDS.filter(w => w.m).length;
  const week = WORDS.filter(w => w.a && now - w.a < 7 * DAY).length;
  const today = WORDS.filter(w => w.a && now - w.a < DAY).length;
  const days = new Set(WORDS.filter(w => w.a).map(w => ymd(w.a)));
  let streak = 0;
  for (let i = 0; i < 400; i++) {
    const d = ymd(now - i * DAY);
    if (days.has(d)) streak++; else if (i > 0) break;
  }
  const pushed = WMETA && WMETA.pushed_at ? new Date(WMETA.pushed_at).toLocaleString('zh-CN') : '从未';
  $('#w-sub').textContent = total
    ? `${total.toLocaleString()} 个词 · 最近同步 ${pushed}`
    : '还没有同步过词库';

  const boxes = {};
  for (const w of WORDS) if (!w.m) boxes[w.b || 1] = (boxes[w.b || 1] || 0) + 1;
  const maxBox = Math.max(1, ...Object.values(boxes));
  $('#w-stats').innerHTML = `
    <div class="grid grid-4" style="margin-bottom:18px">
      <div class="metric"><div class="k">累计收词</div><div class="v">${total.toLocaleString()}</div>
        <div class="s">已掌握 ${mastered}</div></div>
      <div class="metric"><div class="k">掌握率</div>
        <div class="v ${mastered ? 'up' : ''}">${total ? (mastered / total * 100).toFixed(0) + '%' : '—'}</div>
        <div class="s">${total - mastered} 个还在复习</div></div>
      <div class="metric"><div class="k">最近 7 天</div>
        <div class="v ${week ? 'up' : ''}">+${week}</div><div class="s">今天 +${today}</div></div>
      <div class="metric"><div class="k">连续收录</div><div class="v">${streak} 天</div>
        <div class="s">${streak >= 3 ? '保持住' : '今天还没收词的话趁早'}</div></div>
    </div>
    <div class="stats-title">复习进度（Leitner 盒）</div>
    <div class="stats-sub">盒号越大间隔越长，第 5 盒之后就算掌握</div>
    ${[1, 2, 3, 4, 5].map(b => `
      <div class="stat-row">
        <span class="stat-label">第 ${b} 盒</span>
        <span class="stat-bar-track"><span class="stat-bar-fill"
          style="width:${((boxes[b] || 0) / maxBox * 100).toFixed(1)}%"></span></span>
        <span class="stat-value">${boxes[b] || 0}</span>
      </div>`).join('')}`;
}

function wordsChart() {
  if (!WORDS || $('#mod-words').hidden) return;
  const DAY = 86400000, N = 60;
  const counts = new Map();
  for (const w of WORDS) if (w.a) counts.set(ymd(w.a), (counts.get(ymd(w.a)) || 0) + 1);
  const data = [];
  for (let i = N - 1; i >= 0; i--) {
    const d = ymd(Date.now() - i * DAY);
    data.push({ time: d, value: counts.get(d) || 0 });
  }
  $('#w-chart-sub').textContent = `近 ${N} 天共 ${data.reduce((a, x) => a + x.value, 0)} 个`;
  if (wChart) { wChart.remove(); wChart = null; }
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  wChart = LightweightCharts.createChart($('#w-chart'), {
    layout: { background: { color: 'transparent' }, textColor: dark ? '#98989d' : '#86868b',
              fontFamily: 'ui-monospace,SFMono-Regular,Menlo,monospace', fontSize: 11 },
    grid: { vertLines: { visible: false }, horzLines: { color: dark ? '#2c2c2e' : '#f0f0f2' } },
    rightPriceScale: { borderColor: dark ? '#3a3a3c' : '#d2d2d7' },
    timeScale: { borderColor: dark ? '#3a3a3c' : '#d2d2d7', fixLeftEdge: true, fixRightEdge: true },
    localization: { priceFormatter: v => Math.round(v) + ' 个' },
    autoSize: true,
  });
  wChart.addSeries(LightweightCharts.HistogramSeries, { color: dark ? '#0a84ff' : '#0071e3' })
    .setData(data);
  wChart.timeScale().fitContent();
}

$$('#w-filter-seg .seg-btn').forEach(b => {
  b.onclick = () => {
    wFilter = b.dataset.f;
    $$('#w-filter-seg .seg-btn').forEach(x => x.classList.toggle('active', x === b));
    wordsList();
  };
});

function wordsList() {
  if (!WORDS) return;
  const q = ($('#w-search').value || '').trim().toLowerCase();
  const sort = $('#w-sort').value, now = Date.now();
  let rows = WORDS.filter(w => {
    if (wFilter === 'new' && w.m) return false;
    if (wFilter === 'mastered' && !w.m) return false;
    if (wFilter === 'recent' && !(w.a && now - w.a < 7 * 86400000)) return false;
    if (!q) return true;
    return (w.w || '').toLowerCase().includes(q) || (w.t || '').toLowerCase().includes(q)
        || (w.d || '').toLowerCase().includes(q);
  });
  rows.sort((a, b) =>
    sort === 'old' ? (a.a || 0) - (b.a || 0)
    : sort === 'az' ? (a.w || '').localeCompare(b.w || '')
    : sort === 'review' ? (b.r || 0) - (a.r || 0)
    : (b.a || 0) - (a.a || 0));

  if (!rows.length) {
    $('#w-meta').textContent = '';
    $('#w-list').innerHTML = WORDS.length
      ? '<div class="empty-state">没有匹配的词。</div>'
      : `<div class="empty-state">还没有同步过词库。<br><br>
         打开 Word Scanner 插件的词典页，进「设置 → 同步到 kucha.org」，
         填上同步密钥后点「立即同步」。</div>`;
    return;
  }
  const shown = rows.slice(0, 400);
  $('#w-meta').textContent = rows.length > shown.length
    ? `${rows.length} 个词，先显示前 ${shown.length} 个` : `${rows.length} 个词`;

  // 这段结构和插件的「我的词库」完全一致，所以两边看起来是同一个东西
  $('#w-list').innerHTML = shown.map(w => {
    const tags = [
      ...(w.tag ? String(w.tag).split(',').filter(Boolean) : []),
      ...(w.m ? ['已掌握'] : []),
    ].map(t => `<span class="entry-tag${t === '已掌握' ? ' mastered' : ''}">${esc(t)}</span>`).join('');
    return `<div class="entry-row">
      <div class="entry-main">
        <div class="entry-head">
          <span class="entry-word">${esc(w.w)}</span>
          ${w.p ? `<span class="entry-phon">/${esc(w.p)}/</span>` : ''}
          <span class="entry-tags">${tags}</span>
        </div>
        <div class="entry-trans">${esc(w.t || w.d || '释义待补充')}</div>
        ${w.s ? `<div class="entry-sentence">${esc(w.s)}${
          w.src ? `<span class="entry-sentence-tag">${esc(w.src)}</span>` : ''}</div>` : ''}
        <div class="entry-meta-line">${w.a ? ymd(w.a) : '—'} · ${
          w.m ? '已掌握，不再复习' : `第 ${w.b || 1} 盒`} · 复习 ${w.r || 0} 次</div>
      </div>
    </div>`;
  }).join('');
}
$('#w-search').oninput = wordsList;
$('#w-sort').onchange = wordsList;

/* ══════════ 量化 ══════════ */
let DATA = null, MODE = 'live', chart = null, series = [];

async function boot() {
  if (!localStorage.getItem(TK)) return;
  setStatus('', '载入中');
  try {
    const r = await fetch(WORKER + '/quant/dashboard', { headers: auth() });
    if (r.status === 401) { localStorage.removeItem(TK); location.reload(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    render();
  } catch (ex) { setStatus('bad', '读取失败'); }
  poolLoad(); stgReload();
}

function render() {
  const L = DATA.latest, EQ = DATA.equity || [], BT = DATA.backtest;
  if (L) {
    const age = (Date.now() - (L.sent_at || 0)) / 86400000;
    setStatus(age < 4 ? 'ok' : 'hot',
      `${L.date} · ${age < 1 ? '今日已更新' : Math.floor(age) + ' 天前'}`);
  } else setStatus('hot', '尚未收到信号');
  renderTiles(L, EQ); renderChart(EQ, BT); renderOrders(L);
  renderPositions(L); renderBudget(L); renderStops(L);
  renderTrades(DATA.trades || []); renderParams(BT);
}

const metric = (k, v, s, cls) =>
  `<div class="metric"><div class="k">${k}</div><div class="v ${cls || ''}">${v}</div>
   <div class="s">${esc(s)}</div></div>`;

function quoteOf(sym) {
  const p = DATA && DATA.quotes && DATA.quotes.prices && DATA.quotes.prices[sym];
  return typeof p === 'number' ? p : null;
}
function quoteAge() {
  const q = DATA && DATA.quotes;
  if (!q || !q.t) return null;
  const m = (Date.now() - q.t) / 60000;
  if (m < 90) return '报价 ' + new Date(q.t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (m < 60 * 30) return `报价 ${Math.round(m / 60)} 小时前`;
  return null;
}

function renderTiles(L, EQ) {
  let eq = L && L.equity;
  if (eq && L.holdings && DATA.quotes && DATA.quotes.prices) {
    let mv = 0, any = false;
    for (const h of L.holdings) {
      const live = quoteOf(h.symbol);
      if (live != null) any = true;
      mv += h.shares * (live != null ? live : h.last_price);
    }
    if (any) eq = { total: eq.cash + mv, cash: eq.cash, market_value: mv, live: true };
  }
  let chg = null;
  if (EQ.length >= 2) chg = EQ[EQ.length - 1].v / EQ[EQ.length - 2].v - 1;
  const holds = L && L.holdings ? L.holdings.length : 0;
  const maxPos = (DATA.backtest && DATA.backtest.params && DATA.backtest.params.max_positions) || 5;
  const b = L && L.budget;
  const bp = b ? Math.round((b.used_pct || 0) * 100) : null;
  $('#tiles').innerHTML =
    metric('账户权益', eq ? money(eq.total) : '—',
      eq ? `现金 ${money(eq.cash, 0)} · 持仓 ${money(eq.market_value, 0)}${eq.live ? ' · 实时' : ''}`
         : '等待首次信号') +
    metric('较上次', chg == null ? '—' : pct(chg),
      EQ.length ? `已记录 ${EQ.length} 个交易日` : '暂无历史', tone(chg)) +
    metric('持仓', holds + ' / ' + maxPos,
      L ? (L.regime_on ? '大盘上升趋势 · 可开新仓' : '大盘弱势 · 只减不增') : '—') +
    metric('汇丰额度', bp == null ? '—' : bp + '%',
      b ? `${money(b.used_usd, 0)} / ${money(b.cap_usd, 0)}` : '暂无',
      bp == null ? '' : bp >= 85 ? 'down' : bp >= 60 ? 'warn' : '');
}

function renderChart(EQ, BT) {
  const box = $('#chart'), empty = $('#chart-empty'), legend = $('#legend');
  if (!box || $('#mod-quant').hidden || $('#tab-overview').hidden) return;
  const live = (EQ || []).map(p => ({ time: p.d, value: p.v }));
  const btc = (BT && BT.curve) || [];
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const C1 = dark ? '#0a84ff' : '#0071e3', C2 = dark ? '#ff9f0a' : '#d95926';
  let defs, note = '';
  const wantBt = MODE === 'bt' && btc.length >= 2;
  if (!wantBt && live.length >= 2) {
    defs = [{ name: '实盘权益', hex: C1, data: live }];
  } else if (btc.length >= 2) {
    defs = [
      { name: '策略（回测）', hex: C1, data: btc.map(p => ({ time: p.d, value: p.v })) },
      { name: 'QQQ 买入持有', hex: C2,
        data: btc.filter(p => p.b != null).map(p => ({ time: p.d, value: p.b })) },
    ].filter(d => d.data.length >= 2);
    if (live.length < 2) note = '实盘数据不足，先显示回测曲线';
  } else {
    box.hidden = true; empty.hidden = false; legend.innerHTML = '';
    empty.textContent = '还没有权益数据。系统每天美股收盘后运行一次，跑完第一次就会出现在这里。';
    return;
  }
  box.hidden = false; empty.hidden = true;
  legend.innerHTML = defs.map((d, i) =>
    `<span><i style="background:${d.hex}"></i> ${esc(d.name)}
     <b class="mono" id="lg${i}"></b></span>`).join('')
    + (note ? `<span>${esc(note)}</span>` : '');

  if (chart) { chart.remove(); chart = null; series = []; }
  chart = LightweightCharts.createChart(box, {
    layout: { background: { color: 'transparent' }, textColor: dark ? '#98989d' : '#86868b',
              fontFamily: 'ui-monospace,SFMono-Regular,Menlo,monospace', fontSize: 11 },
    grid: { vertLines: { color: dark ? '#2c2c2e' : '#f2f2f4' },
            horzLines: { color: dark ? '#2c2c2e' : '#f2f2f4' } },
    rightPriceScale: { borderColor: dark ? '#3a3a3c' : '#d2d2d7',
                       scaleMargins: { top: .12, bottom: .08 } },
    timeScale: { borderColor: dark ? '#3a3a3c' : '#d2d2d7', fixLeftEdge: true, fixRightEdge: true },
    crosshair: { mode: LightweightCharts.CrosshairMode.Magnet },
    localization: { priceFormatter: v => '$' + Math.round(v).toLocaleString('en-US') },
    autoSize: true,
  });
  series = defs.map((d, i) => {
    const s = chart.addSeries(LightweightCharts.LineSeries,
      { color: d.hex, lineWidth: 2, priceLineVisible: false });
    s.setData(d.data);
    return { def: d, api: s, i };
  });
  chart.timeScale().fitContent();
  const paint = param => series.forEach(({ def, api, i }) => {
    const el = document.getElementById('lg' + i);
    if (!el) return;
    const pt = param && param.seriesData && param.seriesData.get(api);
    el.textContent = money(pt ? pt.value : def.data[def.data.length - 1].value, 0);
  });
  chart.subscribeCrosshairMove(paint); paint(null);
  $('#btn-live').classList.toggle('active', !(defs.length > 1 || wantBt));
  $('#btn-bt').classList.toggle('active', defs.length > 1 || wantBt);
}
$('#btn-live').onclick = () => { MODE = 'live'; if (DATA) renderChart(DATA.equity || [], DATA.backtest); };
$('#btn-bt').onclick = () => { MODE = 'bt'; if (DATA) renderChart(DATA.equity || [], DATA.backtest); };

function renderOrders(L) {
  $('#ord-date').textContent = L ? L.date : '';
  const acts = (L && L.actions) || [];
  if (!acts.length) {
    $('#orders').innerHTML = `<div class="empty-state">${L ? '无买卖指令，持仓照旧。' : '尚未收到信号。'}</div>`;
    return;
  }
  $('#orders').innerHTML = acts.map(a => `
    <div class="order ${a.side === 'buy' ? 'buy' : 'sell'}">
      <div class="h">
        <span class="badge ${a.side === 'buy' ? 'ok' : 'bad'}">${a.side === 'buy' ? '买入' : '卖出'}</span>
        <span class="sym">${esc(a.symbol)}</span>
        <span class="sec mono" style="font-size:13px">${a.shares} 股 @ ${money(a.ref_price)}</span>
      </div>
      <div class="meta">${a.notional ? '约 ' + money(a.notional, 0) : ''}${
        a.stop ? ' · 挂止损 <b class="warn">' + money(a.stop) + '</b>（GTC）' : ''}
        ${a.reason ? '<br>' + esc(a.reason) : ''}</div>
    </div>`).join('');
}

function renderPositions(L) {
  const hs = (L && L.holdings) || [];
  const age = quoteAge();
  $('#pos-count').textContent = hs.length ? `${hs.length} 只${age ? ' · ' + age : ''}` : '';
  if (!hs.length) { $('#positions').innerHTML = '<div class="empty-state">当前空仓。</div>'; return; }
  const alerts = new Map(((DATA.quotes && DATA.quotes.alerts) || []).map(a => [a.symbol, a.level]));
  $('#positions').innerHTML = `<table class="tbl"><thead><tr>
    <th>标的</th><th>股数</th><th>成本</th><th>现价</th><th>盈亏</th><th>止损</th><th>持有</th>
    </tr></thead><tbody>` + hs.map(h => {
      const live = quoteOf(h.symbol), px = live != null ? live : h.last_price;
      const pl = h.entry_price ? px / h.entry_price - 1 : h.pnl_pct;
      const lv = alerts.get(h.symbol);
      const badge = lv === 'hit' ? ' <span class="badge bad">已破止损</span>'
                  : lv === 'near' ? ' <span class="badge hot">逼近止损</span>' : '';
      return `<tr><td><b>${esc(h.symbol)}</b>${badge}</td>
        <td>${h.shares}</td><td>${money(h.entry_price)}</td>
        <td>${money(px)}${live != null ? '<span class="sec" style="font-size:10px">·实时</span>' : ''}</td>
        <td class="${tone(pl)}"><b>${pct(pl)}</b></td>
        <td class="warn">${money(h.stop)}</td>
        <td class="muted">${h.days}d</td></tr>`;
    }).join('') + '</tbody></table>';
}

function renderBudget(L) {
  const b = L && L.budget;
  if (!b) { $('#budget').innerHTML = '<div class="empty-state">暂无额度数据。</div>'; return; }
  const p = Math.min(100, Math.round((b.used_pct || 0) * 100));
  const cls = p >= 85 ? 'bad' : p >= 60 ? 'hot' : '';
  $('#budget').innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:9px;font-size:13px">
      <span class="sec">本月已成交</span>
      <span class="mono">${money(b.used_usd, 0)} / ${money(b.cap_usd, 0)}</span></div>
    <div class="bar"><i class="${cls}" style="width:${p}%"></i></div>
    <div class="hint" style="margin-top:12px">
      上限 HK$250,000（约 $32,051）。超出后美股按首 1000 股 $18 + 每股 $0.015 收佣。
      ${p >= 85 ? '<br><span class="down">额度将尽，本月请克制交易。</span>' : ''}</div>`;
}

function renderStops(L) {
  const su = (L && L.stop_updates) || [];
  if (!su.length) { $('#stops').innerHTML = '<div class="empty-state">无需调整止损。</div>'; return; }
  $('#stops').innerHTML = `<table class="tbl"><thead><tr>
    <th>标的</th><th>原止损</th><th>新止损</th><th>上移</th></tr></thead><tbody>` +
    su.map(s => `<tr><td><b>${esc(s.symbol)}</b></td>
      <td class="muted">${money(s.from)}</td><td class="warn"><b>${money(s.to)}</b></td>
      <td class="up">${pct(s.to / s.from - 1)}</td></tr>`).join('') + '</tbody></table>';
}

function renderTrades(ts) {
  if (!ts.length) {
    $('#trade-summary').textContent = '';
    $('#trades').innerHTML = `<div class="empty-state">还没有已了结的交易。<br>
      系统每完成一次卖出，就会在这里留下一条流水。</div>`;
    return;
  }
  const wins = ts.filter(t => t.pnl > 0).length;
  const net = ts.reduce((a, t) => a + (t.pnl || 0), 0);
  $('#trade-summary').innerHTML = `${ts.length} 笔 · 胜率 ${(wins / ts.length * 100).toFixed(0)}% ·
    净盈亏 <span class="${tone(net)}">${money(net)}</span>`;
  $('#trades').innerHTML = `<table class="tbl"><thead><tr>
    <th>标的</th><th>入场</th><th>离场</th><th>股数</th><th>成本</th><th>卖出</th>
    <th>盈亏</th><th>持有</th><th>原因</th></tr></thead><tbody>` +
    ts.slice(0, 60).map(t => `<tr><td><b>${esc(t.symbol)}</b></td>
      <td class="muted">${esc(t.entry_date || '—')}</td><td class="muted">${esc(t.date)}</td>
      <td>${t.shares}</td><td>${money(t.entry_price)}</td><td>${money(t.exit_price)}</td>
      <td class="${tone(t.pnl)}"><b>${money(t.pnl)}</b>
        <span class="muted" style="font-size:11px">${pct(t.pnl_pct)}</span></td>
      <td class="muted">${t.hold_days}d</td>
      <td class="muted wrap" style="max-width:220px;font-size:11.5px">${esc(t.reason || '')}</td>
    </tr>`).join('') + '</tbody></table>';
}

function renderParams(BT) {
  const p = (BT && BT.params) || {}, st = (BT && BT.stats) || {};
  const rows = [
    ['策略', p.name || '—'], ['标的池', (p.universe_size || '—') + ' 只'],
    ['最大持仓', (p.max_positions ?? '—') + ' 只'],
    ['每笔风险', p.risk_per_trade_pct != null ? (p.risk_per_trade_pct * 100).toFixed(1) + '%' : '—'],
    ['入场', p.breakout_lookback ? `突破 ${p.breakout_lookback} 日新高` : '—'],
    ['止损', p.atr_stop_mult ? `${p.atr_stop_mult} × ATR${p.atr_period || ''}` : '—'],
    ['移动止损', p.trail_mult ? `${p.trail_mult} × ATR` : '—'],
    ['大盘择时', p.regime_ma ? `SPY ${p.regime_ma} 日均线` : '—'],
    ['回测年化', st['年化收益'] != null ? pct(st['年化收益']) : '—'],
    ['回测夏普', st['夏普'] != null ? st['夏普'].toFixed(2) : '—'],
    ['回测最大回撤', st['最大回撤'] != null ? pct(st['最大回撤']) : '—'],
    ['回测区间', st['起止'] || '—'],
  ];
  $('#params').innerHTML = `<div class="grid grid-4" style="margin:0">` + rows.map(([k, v]) =>
    `<div><div class="k" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;
      color:var(--text-secondary);font-family:var(--mono)">${k}</div>
     <div class="mono" style="font-size:13.5px;margin-top:4px">${esc(v)}</div></div>`).join('') + '</div>';
}

/* ══════════ 标的池 ══════════ */
let SP500 = [], SELECTED = new Set(), SAVED = new Set(),
    CUSTOM = {}, FUSE = null, poolTimer = null, poolRemoteQ = '';

async function poolLoad() {
  if (!localStorage.getItem(TK)) return;
  try {
    const d = await (await fetch(WORKER + '/quant/universe', { headers: auth() })).json();
    if (!d.success) throw new Error(d.error || '读取失败');
    SP500 = d.sp500 || []; SELECTED = new Set(d.selected || []); SAVED = new Set(d.selected || []);
    if (window.Fuse && SP500.length) {
      FUSE = new Fuse(SP500, { keys: [{ name: 's', weight: .7 }, { name: 'n', weight: .3 }],
        threshold: .35, ignoreLocation: true, minMatchCharLength: 2 });
    }
    const secs = [...new Set(SP500.map(x => x.sec))].sort();
    $('#uni-sector').innerHTML = '<option value="">全部行业</option>'
      + secs.map(s => `<option value="${esc(s)}">${esc(s)}（${SP500.filter(x => x.sec === s).length}）</option>`).join('');
    poolPaint();
  } catch (ex) {
    $('#pool-chips').innerHTML = `<div class="empty-state">${esc(ex.message)}</div>`;
  }
}

const poolDirty = () => SELECTED.size !== SAVED.size || [...SELECTED].some(s => !SAVED.has(s));

function poolPaint() {
  const n = SELECTED.size;
  $('#pool-count').textContent = n + ' 只';
  $('#tab-pool-count').textContent = n;
  const dirty = poolDirty();
  $('#pool-save').disabled = !dirty;
  $('#pool-state').innerHTML = dirty
    ? `已选 ${n} 只 <span class="warn">· 有未保存改动</span>`
    : `已选 ${n} 只 <span class="up">· 已保存</span>`;
  const known = new Map(SP500.map(x => [x.s, x]));
  const list = [...SELECTED].sort();
  $('#pool-chips').innerHTML = list.length
    ? list.map(s => {
        const x = known.get(s);
        return `<span class="chip${x ? '' : ' custom'}" title="${esc(x ? x.n : (CUSTOM[s] || '自选'))}">
          ${esc(s)}<span class="x" data-s="${esc(s)}">×</span></span>`;
      }).join('')
    : '<div class="empty-state">标的池是空的。用上面的搜索框加几只。</div>';
  $$('#pool-chips .x').forEach(el => { el.onclick = () => { SELECTED.delete(el.dataset.s); poolPaint(); }; });
  uniPaint();
}

function uniRows() {
  const q = ($('#uni-filter').value || '').trim(), sec = $('#uni-sector').value;
  let pool = sec ? SP500.filter(x => x.sec === sec) : SP500;
  if (!q) return pool;
  if (window.Fuse) {
    return new Fuse(pool, { keys: [{ name: 's', weight: .7 }, { name: 'n', weight: .3 }],
      threshold: .35, ignoreLocation: true, minMatchCharLength: 2 }).search(q).map(r => r.item);
  }
  const u = q.toUpperCase();
  return pool.filter(x => x.s.includes(u) || (x.n || '').toUpperCase().includes(u));
}

function uniPaint() {
  const rows = uniRows();
  if (!rows.length) { $('#uni-list').innerHTML = '<div class="empty-state">没有匹配的标的。</div>'; return; }
  $('#uni-list').innerHTML = `<table class="tbl"><tbody>` + rows.map(x => `<tr>
    <td style="width:40px"><input class="uni-cb" type="checkbox" data-s="${esc(x.s)}"${
      SELECTED.has(x.s) ? ' checked' : ''}></td>
    <td style="width:86px"><b>${esc(x.s)}</b></td>
    <td class="muted wrap" style="text-align:left">${esc(x.n)}</td>
    <td class="muted" style="width:90px">${esc(x.sec)}</td></tr>`).join('') + '</tbody></table>';
  $$('.uni-cb').forEach(cb => {
    cb.onchange = () => { cb.checked ? SELECTED.add(cb.dataset.s) : SELECTED.delete(cb.dataset.s); poolPaint(); };
  });
}
$('#uni-filter').oninput = uniPaint;
$('#uni-sector').onchange = uniPaint;
$('#uni-all').onclick = () => { uniRows().forEach(x => SELECTED.add(x.s)); poolPaint(); };
$('#uni-none').onclick = () => { uniRows().forEach(x => SELECTED.delete(x.s)); poolPaint(); };

$('#pool-save').onclick = async () => {
  const msg = $('#pool-msg');
  if (SELECTED.size < 5) { msg.innerHTML = '<span class="down">标的池至少要有 5 只</span>'; return; }
  $('#pool-save').disabled = true; msg.textContent = '保存中…';
  try {
    const d = await (await fetch(WORKER + '/quant/universe', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...auth() },
      body: JSON.stringify({ symbols: [...SELECTED] }) })).json();
    if (!d.success) throw new Error(d.error || '保存失败');
    SAVED = new Set(SELECTED);
    msg.innerHTML = `<span class="up">已保存 ${d.count} 只，下次运行生效</span>`;
  } catch (ex) { msg.innerHTML = `<span class="down">${esc(ex.message)}</span>`; }
  finally { poolPaint(); }
};

const hitRow = (x, inPool, tag) => `<div class="hit">
  <span class="s">${esc(x.s)}</span><span class="n">${esc(x.n || '')}</span>
  <span class="t">${esc(tag || '')}</span>
  ${inPool ? '<span class="badge ok">已在池</span>'
    : `<button class="btn btn-sm pool-add" data-s="${esc(x.s)}" data-n="${esc(x.n || '')}">加入</button>`}
</div>`;

function poolShow(local, remote, q) {
  const box = $('#pool-results');
  const out = local.slice(0, 7).map(x => hitRow(x, SELECTED.has(x.s), x.sec));
  if (remote === 'loading') out.push('<div class="hit"><span class="n">全市场搜索中…</span></div>');
  else if (Array.isArray(remote) && remote.length) {
    out.push('<div class="hit"><span class="t">标普 500 之外</span></div>');
    out.push(...remote.slice(0, 7).map(x => hitRow(x, SELECTED.has(x.s), `${x.t} ${x.ex || ''}`)));
  } else if (remote === 'empty' && !local.length) {
    out.push(`<div class="hit"><span class="n">没找到。${
      /[一-龥]/.test(q) ? '数据源只索引英文名，请用代码或英文名搜。' : ''}</span></div>`);
  }
  if (!out.length) { box.hidden = true; return; }
  box.innerHTML = out.join(''); box.hidden = false;
  $$('#pool-results .pool-add').forEach(b => { b.onclick = () => poolAdd(b.dataset.s, b.dataset.n); });
}

function poolSearch() {
  const q = $('#pool-search').value.trim();
  if (!q) { $('#pool-results').hidden = true; return; }
  const local = FUSE ? FUSE.search(q).map(r => r.item) : SP500.filter(x => x.s.includes(q.toUpperCase()));
  poolShow(local, 'loading', q);
  clearTimeout(poolTimer);
  poolTimer = setTimeout(async () => {
    if (q === poolRemoteQ) return;
    poolRemoteQ = q;
    try {
      const d = await (await fetch(`${WORKER}/quant/search?q=${encodeURIComponent(q)}`,
        { headers: auth() })).json();
      const known = new Set(SP500.map(x => x.s));
      const rem = (d.results || []).filter(x => !known.has(x.s));
      if ($('#pool-search').value.trim() === q) poolShow(local, rem.length ? rem : 'empty', q);
    } catch { if ($('#pool-search').value.trim() === q) poolShow(local, 'empty', q); }
  }, 450);
}

async function poolAdd(sym, name) {
  const msg = $('#pool-msg');
  msg.textContent = `核对 ${sym} 的行情…`;
  try {
    const d = await (await fetch(`${WORKER}/quant/bars?symbol=${encodeURIComponent(sym)}`,
      { headers: auth() })).json();
    if (!d.success) throw new Error(d.error || '查不到行情');
    const n = (d.bars || []).length;
    if (n < 2) throw new Error('这个代码没有可用的日线数据');
    SELECTED.add(sym); CUSTOM[sym] = name || '自选';
    msg.innerHTML = n < 120
      ? `<span class="warn">已加入 ${sym}，但只有 ${n} 根日线，不够算 100 日均线，暂时不会产生信号。记得点保存。</span>`
      : `<span class="up">已加入 ${sym}（${n} 根日线可用）。记得点下方保存。</span>`;
    poolPaint(); poolSearch();
  } catch (ex) { msg.innerHTML = `<span class="down">${esc(ex.message)}</span>`; }
}
$('#pool-search').oninput = poolSearch;
$('#pool-search').onfocus = poolSearch;
document.addEventListener('click', e => {
  if (!e.target.closest('#pool-search') && !e.target.closest('#pool-results')) {
    $('#pool-results').hidden = true;
  }
});

/* ══════════ 策略 ══════════ */
let STG = { presets: {}, active: null, results: {}, spec: {} }, stgCur = null, stgPoll = null;

async function stgApi(method, body) {
  const r = await fetch(WORKER + '/quant/strategies', {
    method, headers: { 'Content-Type': 'application/json', ...auth() },
    body: body ? JSON.stringify(body) : undefined });
  const d = await r.json();
  if (!d.success) throw new Error(d.error || '请求失败');
  return d;
}

async function stgReload(keep) {
  if (!localStorage.getItem(TK)) return;
  try {
    STG = await stgApi('GET');
    $('#tab-stg-name').textContent = STG.active || '未设置';
    const names = Object.keys(STG.presets || {});
    if (!names.length) {
      stgCur = null;
      $('#stg-list').innerHTML = '<div class="empty-state">还没有方案，点「新建」开始。</div>';
      stgNew(); return;
    }
    stgDrawList();
    stgLoad(keep && STG.presets[keep] ? keep
      : (stgCur && STG.presets[stgCur] ? stgCur : (STG.active || names[0])));
  } catch (ex) { $('#stg-form').innerHTML = `<div class="empty-state">${esc(ex.message)}</div>`; }
}

function stgDrawList() {
  $('#stg-list').innerHTML = Object.keys(STG.presets).sort().map(n => {
    const r = STG.results[n];
    const sub = r && r.stats ? `${pct(r.stats['年化收益'])} · 夏普 ${(r.stats['夏普'] || 0).toFixed(2)}`
      : r && r.error ? '回测失败' : '未回测';
    return `<div class="preset ${n === stgCur ? 'on' : ''}" data-n="${esc(n)}">
      <div class="nm">${esc(n)}${n === STG.active ? ' <span class="badge ok">生效中</span>' : ''}</div>
      <div class="sb">${esc(sub)}</div></div>`;
  }).join('');
  $$('.preset').forEach(el => { el.onclick = () => stgLoad(el.dataset.n); });
}

function stgNew() {
  stgCur = null; $('#stg-name').value = ''; $('#stg-note').value = '';
  const v = {}; for (const [k, sp] of Object.entries(STG.spec || {})) v[k] = sp.def;
  stgForm(v); $('#stg-result').innerHTML = ''; stgDrawList();
}
$('#stg-new').onclick = stgNew;

function stgLoad(name) {
  const p = STG.presets[name]; if (!p) return;
  stgCur = name;
  $('#stg-name').value = p.name || name; $('#stg-note').value = p.note || '';
  stgForm(p.params || {}); stgDrawList(); stgResult(STG.results[name]);
}

function stgForm(vals) {
  const groups = {};
  for (const [k, sp] of Object.entries(STG.spec || {})) (groups[sp.group] ||= []).push([k, sp]);
  $('#stg-form').innerHTML = Object.entries(groups).map(([g, items]) => `
    <div style="margin-bottom:22px">
      <div class="group-title">${esc(g)}</div>
      <div class="field-grid">${items.map(([k, sp]) => {
        const v = vals[k] !== undefined ? vals[k] : sp.def;
        let input;
        if (sp.type === 'bool') {
          input = `<label style="display:flex;align-items:center;gap:8px;font-size:13px">
            <input type="checkbox" class="stg-f" data-k="${k}"${v ? ' checked' : ''}>
            <span class="sec">${v ? '开启' : '关闭'}</span></label>`;
        } else if (sp.type === 'enum') {
          input = `<select class="inp stg-f" data-k="${k}">${
            sp.options.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
        } else {
          input = `<input class="inp inp-mono stg-f" type="number" data-k="${k}" value="${v}"
            min="${sp.min}" max="${sp.max}" step="${sp.step || 1}">`;
        }
        return `<div class="field" style="margin:0">
          <label>${esc(sp.label)}${sp.unit ? `<span class="sec"> · ${esc(sp.unit)}</span>` : ''}</label>
          ${input}<div class="hint">${esc(sp.hint)}</div></div>`;
      }).join('')}</div></div>`).join('');
  $$('.stg-f[type="checkbox"]').forEach(cb => {
    cb.onchange = () => {
      const s = cb.parentElement.querySelector('span');
      if (s) s.textContent = cb.checked ? '开启' : '关闭';
    };
  });
}

function stgCollect() {
  const p = {};
  $$('.stg-f').forEach(el => {
    const k = el.dataset.k, sp = STG.spec[k]; if (!sp) return;
    p[k] = sp.type === 'bool' ? el.checked : sp.type === 'enum' ? el.value : Number(el.value);
  });
  return p;
}

function stgResult(r) {
  const box = $('#stg-result');
  if (!r) { box.innerHTML = ''; return; }
  if (r.error) {
    box.innerHTML = `<div class="card"><div class="card-body">
      <span class="down">回测失败：${esc(r.error)}</span></div></div>`;
    return;
  }
  const s = r.stats || {}, bm = r.benchmark || {};
  box.innerHTML = `<div class="card"><div class="card-head"><h2>回测结果</h2>
      <span class="sub">${new Date(r.ran_at).toLocaleString('zh-CN')} · ${r.universe_size} 只标的</span>
    </div><div class="card-body">
    <div class="scroll-x"><table class="tbl" style="margin-bottom:18px">
      <thead><tr><th>　</th><th>年化</th><th>夏普</th><th>最大回撤</th><th>交易笔数</th><th>胜率</th></tr></thead>
      <tbody>
        <tr><td><b>这套策略</b></td>
          <td class="${tone(s['年化收益'])}"><b>${pct(s['年化收益'])}</b></td>
          <td><b>${(s['夏普'] || 0).toFixed(2)}</b></td>
          <td class="down">${pct(s['最大回撤'])}</td>
          <td>${s['交易笔数'] ?? '—'}</td>
          <td>${s['胜率'] != null ? (s['胜率'] * 100).toFixed(0) + '%' : '—'}</td></tr>
        <tr class="muted"><td>QQQ 买入持有</td><td>${pct(bm['年化收益'])}</td>
          <td>${(bm['夏普'] || 0).toFixed(2)}</td><td>${pct(bm['最大回撤'])}</td>
          <td>—</td><td>—</td></tr>
      </tbody></table></div>
    <div class="scroll-x"><table class="tbl">
      <thead><tr><th>分段夏普</th>${(r.segments || []).map(x => `<th>${esc(x.period)}</th>`).join('')}</tr></thead>
      <tbody><tr><td class="muted">越均匀越稳</td>${(r.segments || []).map(x =>
        `<td>${x.sharpe == null ? '—' : x.sharpe.toFixed(2)}</td>`).join('')}</tr></tbody></table></div>
    <div class="hint" style="margin-top:14px">
      三段夏普差距大说明这组参数只在某段行情里好看，换个时期可能就不灵。
      判断一个改动值不值得采用，看它是不是每段都不比原来差，而不是看总收益。
    </div></div></div>`;
}

const stgMsg = (t, bad) => { $('#stg-msg').innerHTML = `<span class="${bad ? 'down' : 'up'}">${esc(t)}</span>`; };

$('#stg-save').onclick = async () => {
  const name = $('#stg-name').value.trim();
  if (!name) return stgMsg('方案名不能为空', true);
  try {
    await stgApi('POST', { name, note: $('#stg-note').value.trim(), params: stgCollect() });
    stgMsg(`已保存「${name}」`); await stgReload(name);
  } catch (ex) { stgMsg(ex.message, true); }
};
$('#stg-activate').onclick = async () => {
  const name = $('#stg-name').value.trim();
  if (!STG.presets[name]) return stgMsg('先保存这套方案', true);
  try { await stgApi('POST', { op: 'activate', name });
    stgMsg(`「${name}」已设为生效，下次运行采用`); await stgReload(name);
  } catch (ex) { stgMsg(ex.message, true); }
};
$('#stg-del').onclick = async () => {
  const name = $('#stg-name').value.trim();
  if (!STG.presets[name]) return stgMsg('这套还没保存过', true);
  try { await stgApi('POST', { op: 'delete', name }); stgCur = null;
    stgMsg(`已删除「${name}」`); await stgReload();
  } catch (ex) { stgMsg(ex.message, true); }
};
$('#stg-bt').onclick = async () => {
  const name = $('#stg-name').value.trim();
  if (!STG.presets[name]) return stgMsg('先保存再回测', true);
  try {
    const d = await (await fetch(WORKER + '/quant/backtest', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...auth() },
      body: JSON.stringify({ name }) })).json();
    if (!d.success) throw new Error(d.error);
    stgMsg('已排队。回测在本机执行，需要 bin/bt_worker.py --watch 守着。');
    stgWatch(name);
  } catch (ex) { stgMsg(ex.message, true); }
};

function stgWatch(name) {
  clearInterval(stgPoll);
  let n = 0;
  stgPoll = setInterval(async () => {
    n++;
    try {
      const d = await stgApi('GET'); STG = d;
      if (d.queue && d.queue.status === 'running') stgMsg('正在计算…');
      if (d.results[name] && (!d.queue || d.queue.status !== 'pending')) {
        clearInterval(stgPoll); stgResult(d.results[name]); stgDrawList();
        stgMsg(d.results[name].error ? '回测失败' : '回测完成');
      }
    } catch { /* 忽略 */ }
    if (n > 60) { clearInterval(stgPoll); stgMsg('等太久了，检查 bt_worker.py 是否在运行', true); }
  }, 5000);
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (DATA) renderChart(DATA.equity || [], DATA.backtest);
  if (WORDS) wordsChart();
});

start();
</script>
